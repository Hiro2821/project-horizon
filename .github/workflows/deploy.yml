name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Secret CESIUM_ION_TOKEN を優先し、無ければ Variable VITE_CESIUM_ION_TOKEN を使う。
          # どちらも未設定なら空文字になり、アプリは平坦な地形で動作する。
          # 注意: VITE_ の値はビルド後のJSに含まれ公開される（Secretはログ上はマスクされるのみ）。
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN || vars.VITE_CESIUM_ION_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
